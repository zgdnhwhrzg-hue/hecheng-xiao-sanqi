<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>合成小三七</title>
<meta name="description" content="三七版合成大西瓜：拖拽三七球，同级相撞合成更高级，合成终极三七即通关">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff8a50'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23fff'/%3E%3Ctext x='32' y='43' font-size='30' font-weight='900' text-anchor='middle' fill='%23ff5722' font-family='sans-serif'%3E%E4%B8%91%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg1:#fff7ec; --bg2:#ffe9c9;
  --ink:#5d4037; --ink2:#8d6e63;
  --accent:#ff7043; --accent-d:#e64a19; --gold:#ffb300;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:radial-gradient(130% 100% at 50% 0%, #fff6e4 0%, var(--bg2) 55%, #ffd3a0 100%);
  color:var(--ink);
  display:flex; justify-content:center; align-items:flex-start;
  min-height:100vh; padding:12px 10px 24px;
  user-select:none; -webkit-user-select:none; overscroll-behavior:none;
}
#app{width:100%; max-width:470px; display:flex; flex-direction:column; align-items:center;}
header{width:100%; display:flex; align-items:center; justify-content:space-between; padding:4px 4px 10px; gap:8px;}
.logo h1{margin:0; font-size:24px; font-weight:900; letter-spacing:2px; color:var(--accent-d); line-height:1.1; text-shadow:0 2px 0 #fff;}
.logo span{display:block; font-size:11px; color:var(--ink2); margin-top:2px; letter-spacing:.5px;}
.stats{display:flex; align-items:center; gap:9px;}
.next{display:flex; flex-direction:column; align-items:center; gap:3px;}
.next img{width:38px; height:38px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 2px 8px rgba(90,50,10,.28); object-fit:cover; background:#fff;}
.next span{font-size:10px; color:var(--ink2); line-height:1;}
.sc{text-align:center; line-height:1.05;}
.sc b{display:block; font-size:21px; font-weight:900; color:var(--ink);}
.sc span{font-size:10px; color:var(--ink2);}
#muteBtn{flex:none; width:36px; height:36px; border-radius:50%; border:2px solid rgba(229,74,25,.35); background:#fff; color:var(--accent-d); font-weight:800; font-size:13px; cursor:pointer; font-family:inherit; box-shadow:0 2px 6px rgba(90,50,10,.15);}
#muteBtn.off{color:#bbb; border-color:#ddd; background:#f7f7f7;}
#gameWrap{position:relative; width:100%;}
#game{display:block; margin:0 auto; height:min(72vh, 660px); max-width:100%; aspect-ratio:3/5; border-radius:22px; box-shadow:0 14px 34px rgba(160,90,20,.28); touch-action:none; background:#ffedd0; cursor:grab;}
#game:active{cursor:grabbing;}
#hint{margin-top:10px; font-size:12px; color:var(--ink2); text-align:center; line-height:1.6; letter-spacing:.3px;}
.overlay{position:fixed; inset:0; background:rgba(48,22,8,.52); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:50; padding:18px; opacity:1; transition:opacity .25s;}
.overlay.hidden{display:none;}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1;}
.card{position:relative; z-index:2; background:#fffaf2; border-radius:24px; padding:18px 18px 20px; box-shadow:0 22px 60px rgba(60,25,5,.4); text-align:center; max-width:360px; width:100%;}
#poster{width:100%; border-radius:16px; box-shadow:0 8px 22px rgba(120,60,15,.28); display:block;}
.btns{display:flex; gap:12px; margin-top:16px; justify-content:center;}
.btns button{border:none; border-radius:999px; padding:12px 14px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; letter-spacing:1px;}
#saveBtn{flex:1.2; background:linear-gradient(135deg,#ff8a50,#ff5722); color:#fff; box-shadow:0 6px 16px rgba(255,87,34,.35);}
#againBtn{flex:1; background:#fff; color:var(--accent-d); border:2px solid var(--accent); box-shadow:0 4px 12px rgba(160,90,20,.18);}
#overOverlay .card{padding:30px 22px;}
#overOverlay h2{margin:0 0 6px; color:var(--accent-d); font-size:28px; font-weight:900; letter-spacing:2px;}
#overOverlay .sad{margin:0 auto 14px; width:74px; height:74px; border-radius:50%; background:linear-gradient(135deg,#ffe0c0,#ffc59a); display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:900; color:#fff; box-shadow:inset 0 -6px 14px rgba(180,90,20,.3);}
#overOverlay p{color:var(--ink2); font-size:14px; margin:0 0 18px;}
#overOverlay p b{color:var(--ink); font-size:16px;}
#restartBtn{width:100%; border:none; border-radius:999px; padding:14px; font-size:16px; font-weight:800; color:#fff; background:linear-gradient(135deg,#ff8a50,#ff5722); box-shadow:0 6px 16px rgba(255,87,34,.35); cursor:pointer; font-family:inherit; letter-spacing:2px;}
#toast{position:fixed; left:50%; bottom:8vh; transform:translateX(-50%) translateY(16px); background:rgba(60,30,10,.93); color:#fff; padding:10px 20px; border-radius:999px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:99;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
@media (max-height:720px){
  #game{height:min(68vh, 580px);}
  header .logo h1{font-size:21px;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <h1>合成小三七</h1>
      <span>三七版合成大西瓜 · 合成终极三七即通关</span>
    </div>
    <div class="stats">
      <div class="next"><img id="nextImg" alt="下一位"><span>下一位</span></div>
      <div class="sc"><b id="scoreVal">0</b><span>得分</span></div>
      <div class="sc"><b id="bestVal">0</b><span>最佳</span></div>
      <button id="muteBtn" title="声音开关">音</button>
    </div>
  </header>
  <div id="gameWrap">
    <canvas id="game"></canvas>
  </div>
  <div id="hint">按住小球左右拖动瞄准，松手下落 · 两个同级三七球相撞即合成为更高级 · 合成 7 级终极三七通关</div>
</div>

<div id="winOverlay" class="overlay hidden">
  <canvas id="confetti"></canvas>
  <div class="card">
    <canvas id="poster" width="720" height="960"></canvas>
    <div class="btns">
      <button id="saveBtn">保存到相册</button>
      <button id="againBtn">再来一局</button>
    </div>
  </div>
</div>

<div id="overOverlay" class="overlay hidden">
  <div class="card">
    <div class="sad">555</div>
    <h2>堆太高啦！</h2>
    <p>本局得分 <b id="overScore">0</b> · 最佳 <b id="overBest">0</b></p>
    <button id="restartBtn">再来一局</button>
  </div>
</div>

<div id="toast"></div>

/* ============ Matter.js 物理世界 ============ */
const { Engine, Bodies, Composite, Events, Body, Vector } = Matter;
const engine = Engine.create();
engine.gravity.y = 1.25;
const world = engine.world;

function addWall(x, y, w, h){
  const b = Bodies.rectangle(x, y, w, h, { isStatic:true, friction:0.05, restitution:0.02, label:'wall' });
  Composite.add(world, b);
}
addWall(W/2, H+28, W+120, 56);   // 地面
addWall(-28, H/2, 56, H+180);    // 左墙
addWall(W+28, H/2, 56, H+180);   // 右墙
addWall(W/2, -72, W+120, 56);    // 顶棚（防止弹出屏幕）

function spawnBall(level, x, y){
  const r = DIAMS[level] / 2;
  const body = Bodies.circle(x, y, r, {
    density: 0.0011 * (1 + level * 0.5),
    restitution: 0.16,
    friction: 0.06,
    frictionStatic: 0.2,
    frictionAir: 0.008,
    label: 'ball'
  });
  body.plugin = { level, born: performance.now(), squash: 0, spawnScale: 0.35, merged: false };
  Composite.add(world, body);
  return body;
}

/* 碰撞挤压形变：相对速度越大，压得越扁，随后弹性恢复 */
Events.on(engine, 'collisionActive', ev => {
  for (const p of ev.pairs) {
    const a = p.bodyA, b = p.bodyB;
    if (a.label !== 'ball' || b.label !== 'ball') continue;
    const sp = Vector.magnitude(Vector.sub(a.velocity, b.velocity));
    if (sp > 2.2) {
      const d = Math.min(0.26, sp * 0.011);
      a.plugin.squash = Math.min(0.26, a.plugin.squash + d * 0.5);
      b.plugin.squash = Math.min(0.26, b.plugin.squash + d * 0.5);
    }
    tryMergePair(a, b);
  }
});

/* 同级相撞合成 */
Events.on(engine, 'collisionStart', ev => {
  for (const p of ev.pairs) {
    tryMergePair(p.bodyA, p.bodyB);
  }
});

function tryMergePair(a, b){
  if (a.label !== 'ball' || b.label !== 'ball') return;
  if (a.plugin.level !== b.plugin.level) return;
  if (a.plugin.merged || b.plugin.merged) return;
  const now = performance.now();
  if (now - a.plugin.born < MERGE_COOLDOWN || now - b.plugin.born < MERGE_COOLDOWN) return;
  if (a.plugin.level >= LEVELS - 1) return; // 7级不再合成
  a.plugin.merged = b.plugin.merged = true;
  doMerge(a, b, a.plugin.level);
}

function doMerge(a, b, lv){
  const nx = (a.position.x + b.position.x) / 2;
  const ny = (a.position.y + b.position.y) / 2;
  const vx = (a.velocity.x + b.velocity.x) / 2;
  const vy = (a.velocity.y + b.velocity.y) / 2;
  Composite.remove(world, a);
  Composite.remove(world, b);
  const nb = spawnBall(lv + 1, nx, ny);
  Body.setVelocity(nb, { x: vx, y: vy });
  // 连击与得分
  const now = performance.now();
  combo = (now - lastMerge < 900) ? combo + 1 : 1;
  lastMerge = now;
  const gain = (lv + 1) * 10 * combo;
  score += gain;
  updateScore();
  ring(nx, ny, DIAMS[lv] / 2, LV_COLORS[lv]);
  popup(nx, ny - 22, '+' + gain, '#ffb300');
  sfx.merge(lv + 1);
  if (lv + 1 === LEVELS - 1) win();
}

/* ============ 特效：粒子 & 飘字 ============ */
const particles = [];
function ring(x, y, r, color){
  for (let i = 0; i < 2; i++) particles.push({ type:'ring', x, y, r: r * 0.5, vr: 3.4, life: 1, color });
  for (let i = 0; i < 16; i++) {
    const an = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.6;
    particles.push({ type:'dot', x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 1.2, life: 1, decay: 0.025 + Math.random() * 0.02, size: 2.5 + Math.random() * 3.5, color });
  }
}
const popups = [];
function popup(x, y, text, color){ popups.push({ x, y, text, color, life: 1 }); }
function tickFx(dt){
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt * 0.0016;
    if (p.type === 'ring') p.r += p.vr * dt * 0.06;
    else { p.vy += 0.18 * dt * 0.06; p.x += p.vx * dt * 0.06; p.y += p.vy * dt * 0.06; }
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= dt * 0.05;
    p.life -= dt * 0.0016;
    if (p.life <= 0) popups.splice(i, 1);
  }
}
function drawFx(){
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.type === 'ring') {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.lineWidth = 4 * p.life; ctx.strokeStyle = p.color; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill();
    }
  }
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = '900 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

/* ============ 音效（WebAudio 合成） ============ */
const sfx = (() => {
  let ac = null, muted = false;
  try { muted = localStorage.getItem('hcdz-muted') === '1'; } catch(e) {}
  function ctx(){
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f0, f1, dur, type, vol){
    if (muted) return;
    const c = ctx(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, c.currentTime);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), c.currentTime + dur);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.03);
  }
  function noise(dur, vol){
    if (muted) return;
    const c = ctx(); if (!c) return;
    const n = c.createBufferSource();
    const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * vol * (1 - i / d.length);
    n.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const g = c.createGain(); g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    n.connect(f); f.connect(g); g.connect(c.destination);
    n.start();
  }
  return {
    get muted(){ return muted; },
    toggle(){ muted = !muted; try { localStorage.setItem('hcdz-muted', muted ? '1' : '0'); } catch(e) {} document.getElementById('muteBtn').classList.toggle('off', muted); },
    drop(){ noise(0.09, 0.5); },
    merge(lv){ tone(280 + lv * 90, 560 + lv * 150, 0.14, 'triangle', 0.3); tone(560 + lv * 150, 900 + lv * 200, 0.12, 'sine', 0.12); },
    win(){ [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone(f, f, 0.2, 'triangle', 0.22), i * 110)); },
    over(){ tone(330, 110, 0.55, 'sawtooth', 0.15); }
  };
})();
document.getElementById('muteBtn').classList.toggle('off', sfx.muted);

/* ============ 画布与绘制 ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * DPR; canvas.height = H * DPR;
ctx.scale(DPR, DPR);

function draw(){
  // 背景
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#fff9ef'); g.addColorStop(0.5, '#ffefd2'); g.addColorStop(1, '#ffdcab');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 底部地面阴影
  const g2 = ctx.createLinearGradient(0, H - 90, 0, H);
  g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(1, 'rgba(130,75,20,.15)');
  ctx.fillStyle = g2; ctx.fillRect(0, H - 90, W, 90);
  // 危险线
  ctx.save();
  ctx.setLineDash([8, 7]);
  ctx.strokeStyle = 'rgba(255,61,61,.55)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,61,61,.8)';
  ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('危险线', W - 8, DANGER_Y - 8);
  ctx.restore();
  // 球体（按 y 排序，下方球画在上层）
  const balls = Composite.allBodies(world).filter(b => b.label === 'ball' && !b.plugin.merged);
  balls.sort((a, b) => a.position.y - b.position.y);
  for (const b of balls) drawBall(b);
  // 持球瞄准
  if (state === 'aiming') drawPreview();
  drawFx();
}

function ballDraw(cx, cy, w, h, lv, angle, alpha){
  // 在已 translate/rotate 的上下文中绘制一个球
  const img = imgs[lv];
  ctx.save();
  ctx.shadowColor = 'rgba(90,50,10,.3)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  ctx.beginPath(); ctx.ellipse(0, 0, w / 2, h / 2, angle, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, w / 2 - 2.5, h / 2 - 2.5, angle, 0, Math.PI * 2);
  ctx.clip();
  ctx.drawImage(img, -w / 2 + 2.5, -h / 2 + 2.5, w - 5, h - 5);
  const grd = ctx.createRadialGradient(0, -h * 0.28, 4, 0, 0, w * 0.62);
  grd.addColorStop(0, 'rgba(255,255,255,.32)'); grd.addColorStop(0.45, 'rgba(255,255,255,0)'); grd.addColorStop(1, 'rgba(0,0,0,.12)');
  ctx.beginPath(); ctx.ellipse(0, 0, w / 2, h / 2, angle, 0, Math.PI * 2);
  ctx.fillStyle = grd; ctx.fill();
  ctx.restore();
  // 等级徽章
  const br = Math.max(11, Math.min(17, w * 0.15));
  const bx = w * 0.31, by = -h * 0.34;
  ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = LV_COLORS[lv]; ctx.stroke();
  ctx.fillStyle = LV_COLORS[lv];
  ctx.font = '900 ' + Math.round(br * 1.05) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(lv + 1, bx, by + 1);
}

function drawBall(b){
  const p = b.plugin;
  const r = b.circleRadius;
  const s = p.spawnScale, sq = p.squash;
  const w = r * 2 * s * (1 + sq), h = r * 2 * s * (1 - sq);
  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  ballDraw(0, 0, w, h, p.level, 0, 1);
  ctx.restore();
}

function drawPreview(){
  const r = DIAMS[nextLevel] / 2;
  ctx.save();
  ctx.setLineDash([5, 8]);
  ctx.strokeStyle = 'rgba(120,80,30,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(aimX, DROP_Y + r * 0.6); ctx.lineTo(aimX, H - 6); ctx.stroke();
  ctx.setLineDash([]);
  ctx.save();
  ctx.translate(aimX, DROP_Y);
  ctx.globalAlpha = 0.92;
  ballDraw(0, 0, r * 2, r * 2, nextLevel, 0, 1);
  ctx.restore();
  ctx.restore();
}

/* ============ 操作：拖拽下落 ============ */
function evtX(e){
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  return (cx - r.left) / r.width * W;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

canvas.addEventListener('pointerdown', e => {
  if (state === 'won' || state === 'over') return;
  e.preventDefault();
  state = 'aiming';
  aimX = clamp(evtX(e), DIAMS[nextLevel] / 2, W - DIAMS[nextLevel] / 2);
}, { passive:false });

window.addEventListener('pointermove', e => {
  if (state !== 'aiming') return;
  aimX = clamp(evtX(e), DIAMS[nextLevel] / 2, W - DIAMS[nextLevel] / 2);
}, { passive:true });

window.addEventListener('pointerup', e => {
  if (state !== 'aiming') return;
  drop(aimX);
}, { passive:true });

function drop(x){
  if (state !== 'aiming') return;
  if (startTime === 0) startTime = performance.now();
  spawnBall(nextLevel, x, DROP_Y);
  sfx.drop();
  nextLevel = pickLevel();
  setNextImg();
  state = 'dropped';
}

function pickLevel(){
  const r = Math.random() * 100;
  if (r < NEXT_WEIGHTS[0]) return 0;
  if (r < NEXT_WEIGHTS[0] + NEXT_WEIGHTS[1]) return 1;
  return 2;
}

/* ============ 胜负判定 ============ */
function checkDanger(){
  if (state === 'won' || state === 'over') return;
  let anyDanger = false;
  for (const b of Composite.allBodies(world)) {
    if (b.label !== 'ball') continue;
    if (b.position.y < DANGER_Y && b.speed < 1.6) anyDanger = true;
    if (b.position.y < -12 && b.speed < 1.6) { gameOver(); return; }
  }
  if (anyDanger) {
    dangerAcc += 16.6;
    if (dangerAcc > 950) gameOver();
  } else dangerAcc = 0;
}

function win(){
  if (won || state === 'won' || state === 'over') return;
  won = true; state = 'won';
  best = Math.max(best, score);
  try { localStorage.setItem('hcdz-best', best); } catch(e) {}
  updateScore();
  sfx.win();
  setTimeout(showWin, 500);
}

function gameOver(){
  if (state === 'won' || state === 'over') return;
  state = 'over';
  best = Math.max(best, score);
  try { localStorage.setItem('hcdz-best', best); } catch(e) {}
  document.getElementById('overScore').textContent = score;
  document.getElementById('overBest').textContent = best;
  document.getElementById('overOverlay').classList.remove('hidden');
  sfx.over();
}

/* ============ 通关海报 & 庆祝 ============ */
const posterEl = document.getElementById('poster');

function showWin(){
  const sec = Math.max(1, Math.round((performance.now() - startTime) / 1000));
  drawPoster(sec);
  document.getElementById('winOverlay').classList.remove('hidden');
  launchConfetti();
}

function drawPoster(sec){
  const c = posterEl.getContext('2d');
  const W2 = 720, H2 = 960;
  const dateStr = new Date().toLocaleDateString('zh-CN');
  const g = c.createLinearGradient(0, 0, 0, H2);
  g.addColorStop(0, '#fff6e8'); g.addColorStop(1, '#ffd7a0');
  c.fillStyle = g; c.fillRect(0, 0, W2, H2);
  // 装饰光环
  c.save();
  c.strokeStyle = 'rgba(255,112,67,.16)'; c.lineWidth = 14;
  c.beginPath(); c.arc(W2/2, 345, 305, 0, Math.PI * 2); c.stroke();
  c.beginPath(); c.arc(W2/2, 345, 338, 0, Math.PI * 2); c.stroke();
  c.restore();
  // 终极三七大图
  c.save();
  c.shadowColor = 'rgba(90,40,10,.32)'; c.shadowBlur = 42; c.shadowOffsetY = 12;
  c.beginPath(); c.arc(W2/2, 345, 232, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
  c.restore();
  c.save();
  c.beginPath(); c.arc(W2/2, 345, 226, 0, Math.PI * 2); c.clip();
  c.drawImage(imgs[LEVELS - 1], W2/2 - 226, 345 - 226, 452, 452);
  c.restore();
  c.save();
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 10;
  c.beginPath(); c.arc(W2/2, 345, 226, 0, Math.PI * 2); c.stroke();
  c.restore();
  // 胜利文案
  c.textAlign = 'center';
  c.fillStyle = '#ff5722';
  c.font = '900 86px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText('终极三七', W2/2, 692);
  c.fillStyle = '#8d6e63';
  c.font = '600 32px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText('小三七合成成功啦！——《合成小三七》通关纪念', W2/2, 752);
  c.fillStyle = '#5d4037';
  c.font = '700 42px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText('本局得分 ' + score + ' · 最佳 ' + best, W2/2, 838);
  c.font = '700 32px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText('耗时 ' + sec + ' 秒 · ' + dateStr, W2/2, 900);
  c.fillStyle = '#a1887f';
  c.font = '500 24px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText('合成小三七 · 终极三七诞生', W2/2, 940);
}

/* 庆祝彩带 */
const confetti = [];
const confettiEl = document.getElementById('confetti');
function launchConfetti(){
  const c = confettiEl.getContext('2d');
  confettiEl.width = window.innerWidth; confettiEl.height = window.innerHeight;
  const colors = ['#ff7043','#ffca28','#66bb6a','#42a5f5','#ec407a','#ffb300'];
  confetti.length = 0;
  for (let i = 0; i < 150; i++) {
    confetti.push({
      x: Math.random() * confettiEl.width,
      y: -20 - Math.random() * confettiEl.height * 0.6,
      vx: (Math.random() - 0.5) * 2.6,
      vy: 1.6 + Math.random() * 2.8,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.24,
      size: 6 + Math.random() * 9,
      color: colors[i % colors.length]
    });
  }
  confettiTick();
}
function confettiTick(){
  if (state !== 'won') return;
  const c = confettiEl.getContext('2d');
  c.clearRect(0, 0, confettiEl.width, confettiEl.height);
  for (const p of confetti) {
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if (p.y > confettiEl.height + 24) { p.y = -24; p.x = Math.random() * confettiEl.width; }
    c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
    c.fillStyle = p.color;
    c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    c.restore();
  }
  requestAnimationFrame(confettiTick);
}

/* ============ 保存到相册 ============ */
function dataUrlToBlob(url){
  const arr = url.split(','), mime = arr[0].match(/:(.*?);/)[1];
  const bin = atob(arr[1]), len = bin.length, bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function savePoster(){
  try {
    const url = posterEl.toDataURL('image/png');
    const file = new File([dataUrlToBlob(url)], '终极三七.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: '终极三七', text: '我的终极三七诞生了！' })
        .then(() => toast('已保存到相册'))
        .catch(() => { download(url); });
    } else {
      download(url);
    }
  } catch(e) {
    toast('保存失败，请截图保存');
  }
}
function download(url){
  const a = document.createElement('a');
  a.href = url; a.download = '终极三七.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('海报已保存');
}

/* ============ 主循环 ============ */
function loop(t){
  requestAnimationFrame(loop);
  Engine.update(engine, 16.666);
  for (const b of Composite.allBodies(world)) {
    if (b.label !== 'ball') continue;
    b.plugin.squash *= 0.86;
    if (b.plugin.spawnScale < 1) b.plugin.spawnScale = Math.min(1, b.plugin.spawnScale + 0.05);
  }
  tickFx(16.6);
  draw();
  checkDanger();
}
requestAnimationFrame(loop);

/* ============ 按钮绑定 ============ */
document.getElementById('muteBtn').addEventListener('click', () => sfx.toggle());
document.getElementById('saveBtn').addEventListener('click', savePoster);

function resetGame(){
  // 单文件预览中刷新页面可能丢失临时地址，因此直接原地重置游戏。
  for (const b of Composite.allBodies(world).slice()) {
    if (b.label === 'ball') Composite.remove(world, b);
  }
  Engine.clear(engine);
  state = 'aiming';
  aimX = W / 2;
  nextLevel = pickLevel();
  score = 0;
  combo = 0;
  lastMerge = 0;
  startTime = 0;
  dangerAcc = 0;
  won = false;
  particles.length = 0;
  popups.length = 0;
  confetti.length = 0;
  document.getElementById('winOverlay').classList.add('hidden');
  document.getElementById('overOverlay').classList.add('hidden');
  const confettiCtx = confettiEl.getContext('2d');
  confettiCtx.clearRect(0, 0, confettiEl.width, confettiEl.height);
  updateScore();
  setNextImg();
  draw();
}

document.getElementById('againBtn').addEventListener('click', resetGame);
document.getElementById('restartBtn').addEventListener('click', resetGame);

nextLevel = pickLevel();
setNextImg();
</script>
